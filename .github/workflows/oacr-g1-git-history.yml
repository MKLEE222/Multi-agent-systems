name: OACR G1 Git History Congruence

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  oacr-g1:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR G1 RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Git runtime
        run: |
          git --version
          python -m py_compile experiments/oacr_g1/run_git_history_congruence_v1.py

      - name: Run OACR-G1 v1
        run: |
          mkdir -p results/oacr_g1
          python experiments/oacr_g1/run_git_history_congruence_v1.py             --out results/oacr_g1/oacr_g1_v1.json
          sha256sum results/oacr_g1/oacr_g1_v1.json | tee results/oacr_g1/oacr_g1_v1.sha256
          cat results/oacr_g1/oacr_g1_v1.json

      - name: Upload OACR-G1 result
        uses: actions/upload-artifact@v4
        with:
          name: oacr-g1-v1
          path: |
            results/oacr_g1/oacr_g1_v1.json
            results/oacr_g1/oacr_g1_v1.sha256
          if-no-files-found: error
