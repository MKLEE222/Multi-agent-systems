name: OACR R1 Relational Retraction

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  oacr-r1:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR R1 RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install exact symbolic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "networkx==3.2.1" "requests==2.32.5"

      - name: Compile preregistered experiment
        run: python -m py_compile experiments/oacr_r1/run_relational_retraction_v1.py

      - name: Run OACR-R1 v1
        run: |
          mkdir -p results/oacr_r1
          python experiments/oacr_r1/run_relational_retraction_v1.py             --out "$GITHUB_WORKSPACE/results/oacr_r1/oacr_r1_v1.json"             --raw_tsv "$GITHUB_WORKSPACE/results/oacr_r1/wikidata_p279_raw.tsv"             --max_witnesses 64             --timeout 120             --retries 4
          sha256sum "$GITHUB_WORKSPACE/results/oacr_r1/oacr_r1_v1.json"             | tee "$GITHUB_WORKSPACE/results/oacr_r1/oacr_r1_v1.sha256"
          sha256sum "$GITHUB_WORKSPACE/results/oacr_r1/wikidata_p279_raw.tsv"             | tee "$GITHUB_WORKSPACE/results/oacr_r1/wikidata_p279_raw.sha256"
          python - <<'PY'
          import json
          x=json.load(open("results/oacr_r1/oacr_r1_v1.json"))
          print(json.dumps(x["summary"], indent=2))
          PY

      - name: Upload frozen relational result
        uses: actions/upload-artifact@v4
        with:
          name: oacr-r1-v1
          path: |
            results/oacr_r1/oacr_r1_v1.json
            results/oacr_r1/oacr_r1_v1.sha256
            results/oacr_r1/wikidata_p279_raw.tsv
            results/oacr_r1/wikidata_p279_raw.sha256
          if-no-files-found: error
