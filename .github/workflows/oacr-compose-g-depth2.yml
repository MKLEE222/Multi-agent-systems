name: OACR COMPOSE-G Depth-2

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  compose-g:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE G RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone pinned git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Compile runner and verifier
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_g5/run_same_contract_git_v1.py
          python -m py_compile experiments/oacr_compose_git/run_depth2_git_v1.py
          python -m py_compile experiments/oacr_compose_git/verify_depth2_git_v1.py

      - name: Run prospective depth-2 test
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_compose_git
          python experiments/oacr_compose_git/run_depth2_git_v1.py \
            --repo external/git \
            --out results/oacr_compose_git/compose_g_depth2_v1.json \
            | tee results/oacr_compose_git/compose_g_depth2_v1.log
          sha256sum results/oacr_compose_git/compose_g_depth2_v1.json \
            | tee results/oacr_compose_git/compose_g_depth2_v1.sha256

      - name: Independently replay H1 and H2
        run: |
          set -euxo pipefail
          python experiments/oacr_compose_git/verify_depth2_git_v1.py \
            --repo external/git \
            --result results/oacr_compose_git/compose_g_depth2_v1.json \
            --out results/oacr_compose_git/compose_g_depth2_v1.verify.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-depth2-v1
          path: |
            results/oacr_compose_git/compose_g_depth2_v1.json
            results/oacr_compose_git/compose_g_depth2_v1.log
            results/oacr_compose_git/compose_g_depth2_v1.sha256
            results/oacr_compose_git/compose_g_depth2_v1.verify.json
          if-no-files-found: error
