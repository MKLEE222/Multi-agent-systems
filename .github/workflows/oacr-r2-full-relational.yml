name: OACR R2 Full Relational Audit

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  oacr-r2:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR R2 RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download frozen R1 carrier
        uses: actions/download-artifact@v4
        with:
          name: oacr-r1-v1
          path: artifacts/r1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36378905855

      - name: Install exact runtime
        run: python -m pip install "networkx==3.2.1"

      - name: Run R2
        run: |
          python -m py_compile experiments/oacr_r2/run_full_relational_audit_v1.py
          mkdir -p results/oacr_r2
          python experiments/oacr_r2/run_full_relational_audit_v1.py             --raw_json artifacts/r1/wikidata_p279_raw.json             --out results/oacr_r2/oacr_r2_v1.json
          sha256sum results/oacr_r2/oacr_r2_v1.json | tee results/oacr_r2/oacr_r2_v1.sha256

      - name: Upload R2
        uses: actions/upload-artifact@v4
        with:
          name: oacr-r2-v1
          path: |
            results/oacr_r2/oacr_r2_v1.json
            results/oacr_r2/oacr_r2_v1.sha256
          if-no-files-found: error
