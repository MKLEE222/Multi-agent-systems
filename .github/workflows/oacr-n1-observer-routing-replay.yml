name: OACR N1 Observer Routing Replay

on:
  workflow_dispatch:
  push:
    branches: [work/ocar-takeover-20261001]
    paths:
      - '.github/workflows/oacr-n1-observer-routing-replay.yml'
      - 'experiments/oacr_n1_diagnostics/**'

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HUB_DISABLE_XET: "1"
  PYTHONHASHSEED: "1729"

jobs:
  prepare-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: edenbiran/RippleEdits
          ref: 54f3b88af4895a3aacb580ec63ce7ae857185040
          path: external/RippleEdits

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Materialize frozen dev-only manifest
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_natural_learned_n1
          python -m py_compile experiments/oacr_natural_learned/prepare_n1_dev_manifest.py
          python experiments/oacr_natural_learned/prepare_n1_dev_manifest.py \
            --repo_root "$GITHUB_WORKSPACE" \
            --ripple_dir "$GITHUB_WORKSPACE/external/RippleEdits" \
            --out "$GITHUB_WORKSPACE/results/oacr_natural_learned_n1/dev_manifest.json"
          python - <<'PY'
          import json
          p=json.load(open("results/oacr_natural_learned_n1/dev_manifest.json",encoding="utf-8"))
          assert p["development_size"]==128
          assert p["evaluation_units_emitted"]==0
          assert len(p["units"])==128
          print("dev-only manifest seal PASS")
          PY
          sha256sum results/oacr_natural_learned_n1/dev_manifest.json \
            | tee results/oacr_natural_learned_n1/dev_manifest.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: oacr-n1-routing-dev-manifest
          path: |
            results/oacr_natural_learned_n1/dev_manifest.json
            results/oacr_natural_learned_n1/dev_manifest.sha256
          if-no-files-found: error

  dev-smoke:
    needs: prepare-dev
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE

      - name: Verify official GRACE commit
        run: test "$(git -C external/GRACE rev-parse HEAD)" = "f674183f17a995d109e10ee6140d4c3e6d016115"

      - uses: actions/download-artifact@v4
        with:
          name: oacr-n1-routing-dev-manifest
          path: results/oacr_natural_learned_n1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install frozen GRACE QA runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.20.1 hydra-core==1.2.0 omegaconf==2.2.3 sentencepiece==0.1.97 numpy==1.24.3 wandb==0.13.2
          python -m pip install huggingface-hub==0.36.2

      - name: Verify observer logits RNG and codebook invariants
        run: |
          set -euxo pipefail
          python experiments/oacr_n1_diagnostics/check_observer_interface.py --grace_repo external/GRACE

      - name: Stage inherited checkpoint at immutable revision
        run: |
          set -euxo pipefail
          python experiments/oacr_natural_learned/prepare_n1_model_snapshot.py --out-dir "$RUNNER_TEMP/oacr_n1_model"
          cp "$RUNNER_TEMP/oacr_n1_model/oacr_snapshot_provenance.json" results/oacr_natural_learned_n1/

      - name: Confirm evaluation seal and compile
        run: |
          set -euxo pipefail
          test ! -e manifests/evaluation_manifest.json
          test ! -e results/oacr_natural_learned_n1/evaluation_manifest.json
          python -m py_compile experiments/oacr_natural_learned/run_n1_dev_only.py

      - name: Replay inherited eight dev units with routing observers
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euxo pipefail
          python experiments/oacr_n1_diagnostics/replay_routing_v1.py \
            --manifest results/oacr_natural_learned_n1/dev_manifest.json \
            --grace_repo external/GRACE \
            --model_dir "$RUNNER_TEMP/oacr_n1_model" \
            --reference_report results/oacr_natural_learned_n1/recovery_36824729008/n1_dev_smoke.json \
            --replay_out results/oacr_natural_learned_n1/n1_observer_replayed_report.json \
            --out results/oacr_natural_learned_n1/n1_routing_diagnostics.json
          sha256sum results/oacr_natural_learned_n1/n1_routing_diagnostics.json \
            | tee results/oacr_natural_learned_n1/n1_routing_diagnostics.sha256

      - name: Verify exact replay before interpreting telemetry
        run: |
          python - <<'PY'
          import json
          p=json.load(open("results/oacr_natural_learned_n1/n1_routing_diagnostics.json"))
          assert p["replay_exact"]
          assert p["evaluation_units_loaded"]==0
          assert len(p["observations"])==32
          print(json.dumps(p["summary"],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oacr-n1-routing-replay
          path: |
            results/oacr_natural_learned_n1/n1_routing_diagnostics.json
            results/oacr_natural_learned_n1/n1_routing_diagnostics.sha256
            results/oacr_natural_learned_n1/n1_observer_replayed_report.json
            results/oacr_natural_learned_n1/oacr_snapshot_provenance.json
          if-no-files-found: warn
