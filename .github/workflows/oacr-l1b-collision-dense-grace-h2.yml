name: OACR L1b Collision Dense GRACE H2

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
  HF_HUB_DISABLE_XET: "1"
  PYTHONPATH: ${{ github.workspace }}/external/GRACE:${{ github.workspace }}/external/GRACE/grace:${{ github.workspace }}/experiments/r1_grace_scotus:${{ github.workspace }}/experiments/oacr_w1:${{ github.workspace }}/experiments/oacr_l1b
  R1_SCOTUS_MODEL_DIR: ${{ github.workspace }}/assets/scotus-bert
  R1_SCOTUS_TOKENIZER_DIR: ${{ github.workspace }}/assets/bert-base-cased
  R1_SCOTUS_TEST_PARQUET: ${{ github.workspace }}/assets/grace-scotus/test.parquet

jobs:
  oacr-l1b:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR L1B RUN]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [509, 601, 709, 809, 907, 1009, 1201, 1409]
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE

      - name: Verify official GRACE commit
        run: test "$(git -C external/GRACE rev-parse HEAD)" = "f674183f17a995d109e10ee6140d4c3e6d016115"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt

      - name: Restore immutable carrier assets
        id: carrier-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2

      - name: Require frozen carrier cache
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          echo "Frozen SCOTUS carrier cache missing; refusing to bootstrap independently in L1b."
          exit 1

      - name: Install frozen runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-r1.txt

      - name: Compile L1b producer and verifier
        run: |
          set -euxo pipefail
          cat assets/asset_manifest.json
          test -s "$R1_SCOTUS_MODEL_DIR/config.json"
          test -s "$R1_SCOTUS_TEST_PARQUET"
          python -m py_compile experiments/oacr_l1b/run_grace_h2_collision_dense_v1.py
          python -m py_compile experiments/oacr_l1b/verify_grace_h2_collision_dense_v1.py

      - name: Run L1b seed ${{ matrix.seed }}
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}"
          python experiments/oacr_l1b/run_grace_h2_collision_dense_v1.py             --repo external/GRACE             --out "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.json"             --seed ${{ matrix.seed }}             --seed_edits 4             --seed_scan_limit 1024             --candidate_bank 512             --anchor_candidates 24             --anchors_per_mode 4             --future_actions 4             --sentinel_reads 24             --max_states 8             --read_atol 1e-6             --read_rtol 1e-5             --device cpu
          sha256sum "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.json"             | tee "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.sha256"

      - name: Verify L1b artifact ${{ matrix.seed }}
        run: |
          set -euxo pipefail
          python experiments/oacr_l1b/verify_grace_h2_collision_dense_v1.py             --artifact "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.json"             | tee "$GITHUB_WORKSPACE/results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.verify.json"

      - name: Upload L1b seed ${{ matrix.seed }}
        uses: actions/upload-artifact@v4
        with:
          name: oacr-l1b-seed-${{ matrix.seed }}
          path: |
            results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.json
            results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.sha256
            results/oacr_l1b/seed_${{ matrix.seed }}/oacr_l1b_seed_${{ matrix.seed }}.verify.json
          if-no-files-found: error
