name: OACR R4 Bidirectional Repair Verification

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR R4 BIDIRECTIONAL REPAIR VERIFY]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile verifier
        run: python -m py_compile experiments/oacr_r4/verify_bidirectional_repair_manifest_v1.py

      - name: Recover accepted R4-building artifact
        run: |
          set -euxo pipefail
          mkdir -p frozen/r4
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11003190307/zip > frozen/r4/building.zip
          unzip -q frozen/r4/building.zip -d frozen/r4/building
          test -f frozen/r4/building/result.json

      - name: Verify bidirectional repair manifest
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_r4_bidirectional
          python experiments/oacr_r4/verify_bidirectional_repair_manifest_v1.py             --result frozen/r4/building/result.json             --manifest docs/OACR_R4_BIDIRECTIONAL_REPAIR_MANIFEST_V1_2026-09-30.json             --out results/oacr_r4_bidirectional/verify.json
          sha256sum results/oacr_r4_bidirectional/verify.json             | tee results/oacr_r4_bidirectional/verify.sha256

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: oacr-r4-bidirectional-repair-verify-v1
          path: results/oacr_r4_bidirectional/
          if-no-files-found: error
