name: OACR G5 Same Contract Git

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  oacr-g5:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR G5 RUN]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        split: [discovery, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone frozen git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Run G5 ${{ matrix.split }}
        run: |
          set -euxo pipefail
          python -m py_compile experiments/common/operational_partition.py
          python -m py_compile experiments/oacr_g5/run_same_contract_git_v1.py
          mkdir -p results/oacr_g5/${{ matrix.split }}
          python experiments/oacr_g5/run_same_contract_git_v1.py             --repo external/git             --split ${{ matrix.split }}             --out results/oacr_g5/${{ matrix.split }}/oacr_g5_${{ matrix.split }}_v1.json
          sha256sum results/oacr_g5/${{ matrix.split }}/oacr_g5_${{ matrix.split }}_v1.json             | tee results/oacr_g5/${{ matrix.split }}/oacr_g5_${{ matrix.split }}_v1.sha256

      - name: Upload G5 ${{ matrix.split }}
        uses: actions/upload-artifact@v4
        with:
          name: oacr-g5-${{ matrix.split }}-v1
          path: |
            results/oacr_g5/${{ matrix.split }}/oacr_g5_${{ matrix.split }}_v1.json
            results/oacr_g5/${{ matrix.split }}/oacr_g5_${{ matrix.split }}_v1.sha256
          if-no-files-found: error
