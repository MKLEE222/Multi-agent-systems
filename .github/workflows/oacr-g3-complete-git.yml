name: OACR G3 Complete Git Characterization

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  oacr-g3:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR G3 RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone frozen git/git history
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Compile search
        run: python -m py_compile experiments/oacr_g2/run_natural_git_history_v1.py

      - name: Execute complete frozen candidate window
        run: |
          mkdir -p results/oacr_g3
          python experiments/oacr_g2/run_natural_git_history_v1.py             --repo external/git             --out results/oacr_g3/oacr_g3_complete_v1.json             --max_merges 10000             --max_witnesses 100
          python - <<'PY'
          import json
          x=json.load(open("results/oacr_g3/oacr_g3_complete_v1.json"))
          s=x["summary"]
          assert s["tested_until_stop"] == s["tree_preserving_candidates"], s
          print(json.dumps(s, indent=2))
          PY
          sha256sum results/oacr_g3/oacr_g3_complete_v1.json             | tee results/oacr_g3/oacr_g3_complete_v1.sha256

      - name: Upload G3
        uses: actions/upload-artifact@v4
        with:
          name: oacr-g3-complete-v1
          path: |
            results/oacr_g3/oacr_g3_complete_v1.json
            results/oacr_g3/oacr_g3_complete_v1.sha256
          if-no-files-found: error
