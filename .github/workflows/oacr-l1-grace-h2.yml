name: OACR L1 GRACE H2

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
  HF_HUB_DISABLE_XET: "1"
  PYTHONPATH: ${{ github.workspace }}/external/GRACE:${{ github.workspace }}/external/GRACE/grace:${{ github.workspace }}/experiments/r1_grace_scotus:${{ github.workspace }}/experiments/oacr_w1:${{ github.workspace }}/experiments/oacr_l1
  R1_SCOTUS_MODEL_DIR: ${{ github.workspace }}/assets/scotus-bert
  R1_SCOTUS_TOKENIZER_DIR: ${{ github.workspace }}/assets/bert-base-cased
  R1_SCOTUS_TEST_PARQUET: ${{ github.workspace }}/assets/grace-scotus/test.parquet

jobs:
  oacr-l1:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR L1 RUN]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [73, 137, 211, 307, 401]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE

      - name: Verify official GRACE commit
        run: test "$(git -C external/GRACE rev-parse HEAD)" = "f674183f17a995d109e10ee6140d4c3e6d016115"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt

      - name: Restore immutable carrier assets
        id: carrier-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2

      - name: Require frozen carrier cache
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          echo "Frozen SCOTUS carrier cache missing; refusing to bootstrap independently in L1."
          exit 1

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-r1.txt

      - name: Preflight
        run: |
          set -euxo pipefail
          cat assets/asset_manifest.json
          test -s "$R1_SCOTUS_MODEL_DIR/config.json"
          test -s "$R1_SCOTUS_TEST_PARQUET"
          python -m py_compile experiments/oacr_l1/run_grace_h2_v1.py

      - name: Run L1 seed ${{ matrix.seed }}
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results/oacr_l1/seed_${{ matrix.seed }}"
          python experiments/oacr_l1/run_grace_h2_v1.py             --repo external/GRACE             --out "$GITHUB_WORKSPACE/results/oacr_l1/seed_${{ matrix.seed }}/oacr_l1_seed_${{ matrix.seed }}.json"             --seed ${{ matrix.seed }}             --seed_edits 4             --seed_scan_limit 512             --candidate_bank 64             --future_actions 3             --sentinel_reads 16             --max_states 4             --device cpu
          sha256sum "$GITHUB_WORKSPACE/results/oacr_l1/seed_${{ matrix.seed }}/oacr_l1_seed_${{ matrix.seed }}.json"             | tee "$GITHUB_WORKSPACE/results/oacr_l1/seed_${{ matrix.seed }}/oacr_l1_seed_${{ matrix.seed }}.sha256"

      - name: Upload L1 seed ${{ matrix.seed }}
        uses: actions/upload-artifact@v4
        with:
          name: oacr-l1-seed-${{ matrix.seed }}
          path: |
            results/oacr_l1/seed_${{ matrix.seed }}/oacr_l1_seed_${{ matrix.seed }}.json
            results/oacr_l1/seed_${{ matrix.seed }}/oacr_l1_seed_${{ matrix.seed }}.sha256
          if-no-files-found: error
