name: OACR COMPOSE-G V3 Merge-Tree Diagnostic

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  diagnose:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE G V3 MERGE TREE DIAGNOSTIC]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone pinned git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3

      - name: Run diagnostic
        run: |
          set -euxo pipefail
          mkdir -p results/v3_merge_tree
          python experiments/oacr_compose_git/diagnose_endogenous_affordance_v3_merge_tree.py \
            --repo external/git \
            --out results/v3_merge_tree/diagnostic.json \
            | tee results/v3_merge_tree/diagnostic.log

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-v3-merge-tree-diagnostic
          path: results/v3_merge_tree
          if-no-files-found: error
