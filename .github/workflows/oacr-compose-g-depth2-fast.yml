name: OACR COMPOSE-G Depth-2 Fast Accepted-H1 Input

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  compose-g-fast:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE G FAST RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download accepted G5 held-out artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs/g5
          gh run download 36385706858 \
            --repo "${{ github.repository }}" \
            --name oacr-g5-validation-v1 \
            --dir inputs/g5
          test -f inputs/g5/oacr_g5_validation_v1.json
          sha256sum inputs/g5/oacr_g5_validation_v1.json

      - name: Clone pinned git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Compile
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_g5/run_same_contract_git_v1.py
          python -m py_compile experiments/oacr_compose_git/run_depth2_git_v1.py
          python -m py_compile experiments/oacr_compose_git/verify_depth2_git_v1.py

      - name: Run depth-2 using accepted H1 artifact
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_compose_git
          python experiments/oacr_compose_git/run_depth2_git_v1.py \
            --repo external/git \
            --g5_json inputs/g5/oacr_g5_validation_v1.json \
            --out results/oacr_compose_git/compose_g_depth2_v1.json \
            | tee results/oacr_compose_git/compose_g_depth2_v1.log
          sha256sum results/oacr_compose_git/compose_g_depth2_v1.json \
            | tee results/oacr_compose_git/compose_g_depth2_v1.sha256

      - name: Independently replay selected H1 and H2
        run: |
          set -euxo pipefail
          python experiments/oacr_compose_git/verify_depth2_git_v1.py \
            --repo external/git \
            --result results/oacr_compose_git/compose_g_depth2_v1.json \
            --out results/oacr_compose_git/compose_g_depth2_v1.verify.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-depth2-v1-fast
          path: |
            results/oacr_compose_git/compose_g_depth2_v1.json
            results/oacr_compose_git/compose_g_depth2_v1.log
            results/oacr_compose_git/compose_g_depth2_v1.sha256
            results/oacr_compose_git/compose_g_depth2_v1.verify.json
          if-no-files-found: error


  compose-g-v2-preflight:
    if: github.event_name == 'issues' && github.event.issue.title == '[OACR COMPOSE G V2 PREFLIGHT]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download accepted G5 held-out artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p inputs/g5
          gh run download 36385706858 \
            --repo "${{ github.repository }}" \
            --name oacr-g5-validation-v1 \
            --dir inputs/g5
          test -f inputs/g5/oacr_g5_validation_v1.json
          test "$(sha256sum inputs/g5/oacr_g5_validation_v1.json | awk '{print $1}')" = "964a3ea6161705721cd3442ceb2c6401c490e69129158ce29fdf2f6151d2fdd7"

      - name: Clone pinned git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Compile v2 preflight
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_g5/run_same_contract_git_v1.py
          python -m py_compile experiments/oacr_compose_git/run_depth2_git_v1.py
          python -m py_compile experiments/oacr_compose_git/preflight_depth2_git_v2.py
          python -m py_compile experiments/oacr_compose_git/verify_preflight_depth2_git_v2.py

      - name: Run v2 structural preflight
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_compose_git_v2
          python experiments/oacr_compose_git/preflight_depth2_git_v2.py \
            --repo external/git \
            --g5_json inputs/g5/oacr_g5_validation_v1.json \
            --out results/oacr_compose_git_v2/preflight_v2.json \
            | tee results/oacr_compose_git_v2/preflight_v2.log
          sha256sum results/oacr_compose_git_v2/preflight_v2.json \
            | tee results/oacr_compose_git_v2/preflight_v2.sha256

      - name: Independently verify v2 structural preflight
        run: |
          set -euxo pipefail
          python experiments/oacr_compose_git/verify_preflight_depth2_git_v2.py \
            --repo external/git \
            --g5_json inputs/g5/oacr_g5_validation_v1.json \
            --preflight results/oacr_compose_git_v2/preflight_v2.json \
            --out results/oacr_compose_git_v2/preflight_v2.verify.json

      - name: Upload v2 preflight
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-v2-preflight
          path: |
            results/oacr_compose_git_v2/preflight_v2.json
            results/oacr_compose_git_v2/preflight_v2.log
            results/oacr_compose_git_v2/preflight_v2.sha256
            results/oacr_compose_git_v2/preflight_v2.verify.json
          if-no-files-found: error


  compose-sqec-bridge:
    if: github.event_name == 'issues' && github.event.issue.title == '[OACR SQEC COMPOSE BRIDGE]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone pinned SQEC snapshot
        run: |
          set -euxo pipefail
          git clone --quiet --no-tags https://github.com/MKLEE222/qualification_opportunity_compiler.git external/sqec
          git -C external/sqec checkout --detach 1111368c37b8e00d04ade5456e3d59070465c3ff
          test "$(git -C external/sqec rev-parse HEAD)" = "1111368c37b8e00d04ade5456e3d59070465c3ff"

      - name: Reproduce controlled depth-2 bridge
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_compose_sqec/verify_sqec_depth2_bridge_v1.py
          mkdir -p results/oacr_compose_sqec
          python experiments/oacr_compose_sqec/verify_sqec_depth2_bridge_v1.py \
            --sqec_core external/sqec/02_core \
            --out results/oacr_compose_sqec/sqec_depth2_bridge_v1.json \
            | tee results/oacr_compose_sqec/sqec_depth2_bridge_v1.log
          sha256sum results/oacr_compose_sqec/sqec_depth2_bridge_v1.json \
            | tee results/oacr_compose_sqec/sqec_depth2_bridge_v1.sha256

      - name: Upload SQEC bridge
        uses: actions/upload-artifact@v4
        with:
          name: oacr-sqec-compose-depth2-bridge-v1
          path: |
            results/oacr_compose_sqec/sqec_depth2_bridge_v1.json
            results/oacr_compose_sqec/sqec_depth2_bridge_v1.log
            results/oacr_compose_sqec/sqec_depth2_bridge_v1.sha256
          if-no-files-found: error
