name: OACR COMPOSE-G V3 H1 Endogenous Affordance Preflight

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  TZ: "UTC"

jobs:
  shard:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE G V3 H1 PREFLIGHT]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone pinned git/git
        run: |
          set -euxo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/git/git.git external/git
          git -C external/git checkout --detach 34f06850c16c7f7ac822b1adc71354f11b0f2ca3
          test "$(git -C external/git rev-parse HEAD)" = "34f06850c16c7f7ac822b1adc71354f11b0f2ca3"

      - name: Compile H1 preflight
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_g5/run_same_contract_git_v1.py
          python -m py_compile experiments/oacr_compose_git/preflight_endogenous_affordance_v3.py

      - name: Run shard
        run: |
          set -euxo pipefail
          mkdir -p results/v3_h1/shard_${{ matrix.shard }}
          python experiments/oacr_compose_git/preflight_endogenous_affordance_v3.py \
            --repo external/git \
            --shard_index ${{ matrix.shard }} \
            --shards 8 \
            --out results/v3_h1/shard_${{ matrix.shard }}/shard_${{ matrix.shard }}.json \
            | tee results/v3_h1/shard_${{ matrix.shard }}/shard_${{ matrix.shard }}.log

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-v3-h1-shard-${{ matrix.shard }}
          path: results/v3_h1/shard_${{ matrix.shard }}
          if-no-files-found: error

  aggregate:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE G V3 H1 PREFLIGHT]'
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: oacr-compose-g-v3-h1-shard-*
          path: inputs/shards

      - name: Aggregate and integrity-check
        run: |
          set -euxo pipefail
          mkdir -p results/v3_h1_aggregate
          python experiments/oacr_compose_git/aggregate_endogenous_affordance_v3.py \
            --input_dir inputs/shards \
            --out results/v3_h1_aggregate/aggregate.json \
            | tee results/v3_h1_aggregate/aggregate.log
          sha256sum results/v3_h1_aggregate/aggregate.json \
            | tee results/v3_h1_aggregate/aggregate.sha256

      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-g-v3-h1-aggregate
          path: results/v3_h1_aggregate
          if-no-files-found: error
