name: OACR M2 R Nested Contract

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  oacr-m2-r:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR M2 R RUN]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download frozen R1 carrier
        uses: actions/download-artifact@v4
        with:
          name: oacr-r1-v1
          path: artifacts/r1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36378905855

      - name: Install exact runtime
        run: python -m pip install "networkx==3.2.1"

      - name: Run M2-R nested-contract trajectory
        run: |
          set -euxo pipefail
          python -m py_compile experiments/common/operational_partition.py
          python -m py_compile experiments/oacr_m2/run_relational_nested_contract_v1.py
          mkdir -p results/oacr_m2/r
          python experiments/oacr_m2/run_relational_nested_contract_v1.py \
            --raw_json artifacts/r1/wikidata_p279_raw.json \
            --out results/oacr_m2/r/oacr_m2_r_v1.json
          sha256sum results/oacr_m2/r/oacr_m2_r_v1.json | tee results/oacr_m2/r/oacr_m2_r_v1.sha256

      - name: Upload M2-R
        uses: actions/upload-artifact@v4
        with:
          name: oacr-m2-r-v1
          path: |
            results/oacr_m2/r/oacr_m2_r_v1.json
            results/oacr_m2/r/oacr_m2_r_v1.sha256
          if-no-files-found: error
