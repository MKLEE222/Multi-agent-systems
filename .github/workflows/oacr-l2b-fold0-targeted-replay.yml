name: OACR L2b Fold0 Targeted Replay

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
  HF_HUB_DISABLE_XET: "1"
  PYTHONPATH: ${{ github.workspace }}/external/GRACE:${{ github.workspace }}/external/GRACE/grace:${{ github.workspace }}/experiments/r1_grace_scotus:${{ github.workspace }}/experiments/oacr_l2b
  R1_SCOTUS_MODEL_DIR: ${{ github.workspace }}/assets/scotus-bert
  R1_SCOTUS_TOKENIZER_DIR: ${{ github.workspace }}/assets/bert-base-cased
  R1_SCOTUS_TEST_PARQUET: ${{ github.workspace }}/assets/grace-scotus/test.parquet

jobs:
  replay:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR L2B FOLD0 REPLAY]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE

      - name: Verify official GRACE commit
        run: test "$(git -C external/GRACE rev-parse HEAD)" = "f674183f17a995d109e10ee6140d4c3e6d016115"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt

      - name: Restore immutable carrier assets
        id: carrier-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2

      - name: Require frozen carrier cache
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          echo "Frozen SCOTUS carrier cache missing; refusing replay."
          exit 1

      - name: Install frozen runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-r1.txt

      - name: Compile targeted replay
        run: |
          set -euxo pipefail
          python -m py_compile experiments/oacr_l2b/replay_fold0_positive_v1.py

      - name: Run targeted native replay
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euxo pipefail
          mkdir -p results/oacr_l2b_fold0_replay
          python experiments/oacr_l2b/replay_fold0_positive_v1.py \
            --repo external/GRACE \
            --out "$GITHUB_WORKSPACE/results/oacr_l2b_fold0_replay/replay.json" \
            --device cpu \
            | tee results/oacr_l2b_fold0_replay/replay.log
          sha256sum results/oacr_l2b_fold0_replay/replay.json \
            | tee results/oacr_l2b_fold0_replay/replay.sha256

      - name: Upload replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: oacr-l2b-fold0-targeted-replay
          path: |
            results/oacr_l2b_fold0_replay/replay.json
            results/oacr_l2b_fold0_replay/replay.log
            results/oacr_l2b_fold0_replay/replay.sha256
          if-no-files-found: error
