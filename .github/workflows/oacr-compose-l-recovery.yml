name: OACR COMPOSE-L Recovery Hysteresis

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: \${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: \${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: \${{ github.workspace }}/.cache/huggingface/datasets
  HF_HUB_DISABLE_XET: "1"
  PYTHONPATH: \${{ github.workspace }}/external/GRACE:\${{ github.workspace }}/external/GRACE/grace:\${{ github.workspace }}/experiments/r1_grace_scotus:\${{ github.workspace }}/experiments/oacr_compose_learned
  R1_SCOTUS_MODEL_DIR: \${{ github.workspace }}/assets/scotus-bert
  R1_SCOTUS_TOKENIZER_DIR: \${{ github.workspace }}/assets/bert-base-cased
  R1_SCOTUS_TEST_PARQUET: \${{ github.workspace }}/assets/grace-scotus/test.parquet

jobs:
  recovery-hysteresis:
    if: github.event_name != 'issues' || github.event.issue.title == '[OACR COMPOSE L RECOVERY RUN]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fold: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE

      - name: Verify official GRACE commit
        run: test "$(git -C external/GRACE rev-parse HEAD)" = "f674183f17a995d109e10ee6140d4c3e6d016115"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt

      - name: Restore immutable carrier assets
        id: carrier-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2

      - name: Require frozen carrier cache
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          echo "Frozen SCOTUS carrier cache missing; refusing to bootstrap independently."
          exit 1

      - name: Install frozen runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-r1.txt

      - name: Compile producer and verifier
        run: |
          set -euxo pipefail
          cat assets/asset_manifest.json
          test -s "$R1_SCOTUS_MODEL_DIR/config.json"
          test -s "$R1_SCOTUS_TEST_PARQUET"
          python -m py_compile experiments/oacr_compose_learned/run_recovery_hysteresis_v1.py
          python -m py_compile experiments/oacr_compose_learned/verify_recovery_hysteresis_v1.py

      - name: Run recovery hysteresis fold \${{ matrix.fold }}
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euxo pipefail
          mkdir -p "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}"
          python experiments/oacr_compose_learned/run_recovery_hysteresis_v1.py \
            --repo external/GRACE \
            --fold \${{ matrix.fold }} \
            --future_bank 512 \
            --anchor_bank 256 \
            --future_actions 3 \
            --sentinels 32 \
            --max_recovered 4 \
            --read_atol 1e-6 \
            --read_rtol 1e-5 \
            --device cpu \
            --out "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/producer.json"
          sha256sum "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/producer.json" \
            | tee "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/producer.sha256"

      - name: Verify artifact fold \${{ matrix.fold }}
        run: |
          set -euxo pipefail
          python experiments/oacr_compose_learned/verify_recovery_hysteresis_v1.py \
            --artifact "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/producer.json" \
            | tee "results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/verify.json"

      - name: Upload fold artifact
        uses: actions/upload-artifact@v4
        with:
          name: oacr-compose-l-recovery-fold-\${{ matrix.fold }}
          path: results/oacr_compose_l_recovery/fold_\${{ matrix.fold }}/
          if-no-files-found: error
