name: R1 GRACE SCOTUS Blind

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-grace-scotus.yml"
      - "experiments/r1_grace_scotus/**"
      - "requirements-r1.txt"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "42"
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
  HF_HUB_DISABLE_XET: "1"
  PYTHONPATH: ${{ github.workspace }}/external/GRACE:${{ github.workspace }}/external/GRACE/grace:${{ github.workspace }}/experiments/r1_grace_scotus
  R1_SCOTUS_MODEL_DIR: ${{ github.workspace }}/assets/scotus-bert
  R1_SCOTUS_TOKENIZER_DIR: ${{ github.workspace }}/assets/bert-base-cased
  R1_SCOTUS_TEST_PARQUET: ${{ github.workspace }}/assets/grace-scotus/test.parquet

jobs:
  prediction:
    if: github.event_name != 'issues' || github.event.issue.title == '[R1 RUN] GRACE SCOTUS'
    name: Prediction only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt
      - name: Restore immutable carrier assets
        id: carrier-cache
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2
      - name: Bootstrap immutable Hugging Face assets
        if: steps.carrier-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          python -m venv .hf-bootstrap
          .hf-bootstrap/bin/python -m pip install --upgrade pip
          .hf-bootstrap/bin/python -m pip install "huggingface_hub==0.27.1" "requests>=2.31"
          mkdir -p assets/scotus-bert assets/bert-base-cased assets/grace-scotus
          .hf-bootstrap/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests
          from huggingface_hub import HfApi, snapshot_download

          root = Path("assets")
          api = HfApi()
          model_id = "tomh/scotus-bert"
          tok_id = "google-bert/bert-base-cased"
          model_sha = api.model_info(model_id).sha
          tok_sha = api.model_info(tok_id).sha
          snapshot_download(
              repo_id=model_id, revision=model_sha,
              local_dir=str(root / "scotus-bert"),
              local_dir_use_symlinks=False,
          )
          snapshot_download(
              repo_id=tok_id, revision=tok_sha,
              local_dir=str(root / "bert-base-cased"),
              local_dir_use_symlinks=False,
          )

          meta_url = "https://datasets-server.huggingface.co/parquet?dataset=tomh/grace-scotus"
          meta = requests.get(meta_url, timeout=60)
          meta.raise_for_status()
          entries = meta.json()["parquet_files"]
          tests = [x for x in entries if x.get("split") == "test"]
          if len(tests) != 1:
              raise RuntimeError(f"Expected exactly one SCOTUS test parquet, got {len(tests)}")
          entry = tests[0]
          resp = requests.get(entry["url"], stream=True, timeout=120)
          resp.raise_for_status()
          out = root / "grace-scotus" / "test.parquet"
          h = hashlib.sha256()
          size = 0
          with out.open("wb") as fh:
              for chunk in resp.iter_content(chunk_size=1024*1024):
                  if chunk:
                      fh.write(chunk); h.update(chunk); size += len(chunk)
          manifest = {
              "model_id": model_id, "model_revision": model_sha,
              "tokenizer_id": tok_id, "tokenizer_revision": tok_sha,
              "dataset_id": "tomh/grace-scotus",
              "dataset_test_url": entry["url"],
              "dataset_test_sha256": h.hexdigest(),
              "dataset_test_size": size,
          }
          (root / "asset_manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          rm -rf .hf-bootstrap
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen runtime dependencies
        run: python -m pip install -r requirements-r1.txt
      - name: Preflight local carrier assets
        run: |
          set -euxo pipefail
          cat assets/asset_manifest.json
          test -s "$R1_SCOTUS_MODEL_DIR/config.json"
          test -s "$R1_SCOTUS_TEST_PARQUET"
          python - <<'PY'
          import os
          from transformers import AutoConfig, AutoTokenizer
          import pyarrow.parquet as pq
          cfg = AutoConfig.from_pretrained(os.environ["R1_SCOTUS_MODEL_DIR"], local_files_only=True)
          tok = AutoTokenizer.from_pretrained(os.environ["R1_SCOTUS_TOKENIZER_DIR"], local_files_only=True)
          table = pq.read_table(os.environ["R1_SCOTUS_TEST_PARQUET"], columns=["text", "label"])
          print("model_type", cfg.model_type)
          print("tokenizer", type(tok).__name__)
          print("test_rows", table.num_rows, "columns", table.column_names)
          assert table.num_rows == 931
          assert table.column_names == ["text", "label"]
          PY
      - name: Generate frozen structural prediction manifest
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/predict_scotus_structural_hazard.py \
            --repo external/GRACE \
            --out results/prediction.json \
            --seed_edits 4 \
            --candidate_bank 64 \
            --future_per_anchor 6 \
            --anchors_per_mode 1 \
            --seed_scan_limit 512 \
            --seed 42 \
            --device cpu
          sha256sum results/prediction.json | tee results/prediction.sha256
          cp assets/asset_manifest.json results/asset_manifest.json
      - name: Upload frozen prediction
        uses: actions/upload-artifact@v4
        with:
          name: r1-prediction
          path: |
            results/prediction.json
            results/prediction.sha256
            results/asset_manifest.json
          if-no-files-found: error

  execution:
    name: Future-write execution
    needs: prediction
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-r1.txt
      - name: Restore immutable carrier assets
        uses: actions/cache@v4
        with:
          path: assets
          key: r1-scotus-carrier-assets-v2
          fail-on-cache-miss: true
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen runtime dependencies
        run: python -m pip install -r requirements-r1.txt
      - name: Execute paired future writes without reading prediction artifact
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/run_scotus_paired_closure.py \
            --repo external/GRACE \
            --out results/actual.json \
            --seed_edits 4 \
            --candidate_bank 64 \
            --future_per_anchor 6 \
            --anchors_per_mode 1 \
            --seed_scan_limit 512 \
            --seed 42 \
            --device cpu
          sha256sum results/actual.json | tee results/actual.sha256
          cp assets/asset_manifest.json results/asset_manifest.json
      - name: Upload execution results
        uses: actions/upload-artifact@v4
        with:
          name: r1-actual
          path: |
            results/actual.json
            results/actual.sha256
            results/asset_manifest.json
          if-no-files-found: error

  validate:
    name: Blind validation
    needs: [prediction, execution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: r1-prediction
          path: artifacts/prediction
      - uses: actions/download-artifact@v4
        with:
          name: r1-actual
          path: artifacts/actual
      - name: Verify carrier asset identity
        run: cmp artifacts/prediction/asset_manifest.json artifacts/actual/asset_manifest.json
      - name: Validate frozen predictions against actual outcomes
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/validate_structural_predictions.py \
            --prediction artifacts/prediction/prediction.json \
            --actual artifacts/actual/actual.json \
            --out results/validation.json
          cat artifacts/prediction/prediction.sha256
          cat artifacts/actual/actual.sha256
          cat results/validation.json
      - name: Upload blind validation
        uses: actions/upload-artifact@v4
        with:
          name: r1-validation
          path: results/validation.json
          if-no-files-found: error
