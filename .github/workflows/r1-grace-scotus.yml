name: R1 GRACE SCOTUS Blind

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r1-grace-scotus.yml"
      - "experiments/r1_grace_scotus/**"
      - "requirements-r1.txt"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "42"
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: "disabled"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface/transformers
  HF_DATASETS_CACHE: ${{ github.workspace }}/.cache/huggingface/datasets
  PYTHONPATH: ${{ github.workspace }}/external/GRACE:${{ github.workspace }}/external/GRACE/grace:${{ github.workspace }}/experiments/r1_grace_scotus

jobs:
  prediction:
    name: Prediction only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen dependencies
        run: python -m pip install -r requirements-r1.txt
      - name: Preflight imports
        run: |
          python - <<'PY'
          import torch, transformers, datasets, hydra, omegaconf
          from grace.dataset import SCOTUS
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("datasets", datasets.__version__)
          print("SCOTUS import OK")
          PY
      - name: Generate frozen structural prediction manifest
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/predict_scotus_structural_hazard.py             --repo external/GRACE             --out results/prediction.json             --seed_edits 4             --candidate_bank 64             --future_per_anchor 6             --anchors_per_mode 1             --seed_scan_limit 512             --seed 42             --device cpu
          sha256sum results/prediction.json | tee results/prediction.sha256
      - name: Upload frozen prediction
        uses: actions/upload-artifact@v4
        with:
          name: r1-prediction
          path: |
            results/prediction.json
            results/prediction.sha256
          if-no-files-found: error

  execution:
    name: Future-write execution
    needs: prediction
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Thartvigsen/GRACE
          ref: f674183f17a995d109e10ee6140d4c3e6d016115
          path: external/GRACE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen dependencies
        run: python -m pip install -r requirements-r1.txt
      - name: Execute paired future writes without reading prediction artifact
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/run_scotus_paired_closure.py             --repo external/GRACE             --out results/actual.json             --seed_edits 4             --candidate_bank 64             --future_per_anchor 6             --anchors_per_mode 1             --seed_scan_limit 512             --seed 42             --device cpu
          sha256sum results/actual.json | tee results/actual.sha256
      - name: Upload execution results
        uses: actions/upload-artifact@v4
        with:
          name: r1-actual
          path: |
            results/actual.json
            results/actual.sha256
          if-no-files-found: error

  validate:
    name: Blind validation
    needs: [prediction, execution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r1-prediction
          path: artifacts/prediction
      - uses: actions/download-artifact@v4
        with:
          name: r1-actual
          path: artifacts/actual
      - name: Validate frozen predictions against actual outcomes
        run: |
          mkdir -p results
          python experiments/r1_grace_scotus/validate_structural_predictions.py             --prediction artifacts/prediction/prediction.json             --actual artifacts/actual/actual.json             --out results/validation.json
          cat artifacts/prediction/prediction.sha256
          cat artifacts/actual/actual.sha256
          cat results/validation.json
      - name: Upload blind validation
        uses: actions/upload-artifact@v4
        with:
          name: r1-validation
          path: results/validation.json
          if-no-files-found: error
